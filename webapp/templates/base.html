<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Disposition Tool{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-blue.png') }}">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="icon-btn hamburger-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/logo-on-navy.png') }}" alt="On Q Property Management" class="logo">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-title">Disposition Tool</span>
      </a>
    </div>
    <div class="topbar-right">
      <button type="button" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle light/dark mode">
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      {% if session.get('authed') %}<a class="avatar" href="{{ url_for('logout') }}" title="Log out">⏻</a>{% endif %}
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">On Q Property Management</footer>
  <script>
    (function () {
      var root = document.documentElement;
      var sunIcon = document.getElementById('icon-sun');
      var moonIcon = document.getElementById('icon-moon');
      var toggleBtn = document.getElementById('theme-toggle');

      function effectiveTheme() {
        var explicit = root.getAttribute('data-theme');
        if (explicit === 'light' || explicit === 'dark') return explicit;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function updateIcon() {
        var dark = effectiveTheme() === 'dark';
        sunIcon.style.display = dark ? 'none' : 'block';
        moonIcon.style.display = dark ? 'block' : 'none';
      }

      toggleBtn.addEventListener('click', function () {
        var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });

      updateIcon();
    })();
  </script>
</body>
</html>
